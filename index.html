<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f4f1e8" />
    <title>AI 開發進化營－互動式課程簡報</title>
    <style>
      /*
       * 避免載入時閃深色。這三處（color-scheme、theme-color、下面這行）
       * 活在 React 樹與 Tailwind build 之外，任何 token 層級的搜尋都掃不到，
       * 改色票時最容易漏。值要跟 theme.css 的 --color-ink 一致。
       */
      html { background: #f4f1e8; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
